<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lợi ích công nghệ số</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
		main { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
		h1 { color: #145da0; text-align: center; }
		.description { text-align: center; font-size: 1.1rem; }
		.card { background: #fff; padding: 20px; margin-top: 24px; border-radius: 12px; box-shadow: 0 2px 10px #0001; }
		img { display: block; max-width: 100%; height: auto; margin: auto; }
		.video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
		.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
		footer { margin-top: 24px; text-align: center; font-size: .9rem; color: #5b6470; }
	</style>
</head>
<body>
	<main>
		<h1>Lợi ích công nghệ số</h1>
		<p class="description">Infographic giới thiệu những lợi ích thiết thực của công nghệ số trong học tập, công việc và cuộc sống.</p>

		<section class="card" aria-labelledby="infographic-title">
			<h2 id="infographic-title">Infographic</h2>
			<img src="Lab05_Ex2.1.png.png" alt="Infographic về lợi ích công nghệ số">
		</section>

		<section class="card" aria-labelledby="video-title">
			<h2 id="video-title">Video Nhiệm vụ 2.2</h2>
			<div class="video">
				<iframe src="https://www.youtube-nocookie.com/embed/kc6klteVGII" title="Lợi ích công nghệ số" allowfullscreen></iframe>
			</div>
		</section>

		<footer>Video tạo bởi CapCut, tài liệu từ Pexels/FreeSound (CC0).</footer>
		<footer>
    <p>
        Ghi chú nguồn AI: Mã nguồn được tạo và hỗ trợ bởi GitHub Copilot.
    </p>
</footer>
	</main>
</body>
</html>
